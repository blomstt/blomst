[mgr]
ratio = [2, 2, 4]
sort_by = "natural"
sort_sensitive = true
sort_reverse = false
sort_dir_first = true
linemode = "size"
show_hidden = false
show_symlink = true
scrolloff = 5

[preview]
tab_size = 2
max_width = 600
max_height = 900
cache_dir = ""
image_filter = "triangle"
image_quality = 75
sixel_fraction = 15
ueberzug_scale = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
# Yazi fills in the files itself: %s is every selected file, %s1 the first one, %d1 the folder of the first.
# It quotes them, so no quotes around them. The old shell-style "$@" and "$1" are no longer filled in.
edit = [
  # editor
  { run = "nvim %s", desc = "nvim", block = true, for = "unix" },
  { run = "code %s", desc = "code", orphan = true, for = "unix" },
  { run = "code %s", desc = "code", orphan = true, for = "windows" },
]
open = [
  # system app
  { run = "xdg-open %s1", desc = "Open", orphan = true, for = "linux" },
  { run = "open %s", desc = "Open", for = "macos" },
  { run = 'start "" %s1', desc = "Open", orphan = true, for = "windows" },
]
reveal = [
  # reveal: the containing folder in the file manager
  { run = "xdg-open %d1", desc = "Reveal", orphan = true, for = "linux" },
  { run = "open -R %s1", desc = "Reveal", for = "macos" },
  { run = "explorer /select,%s1", desc = "Reveal", orphan = true, for = "windows" },
]
extract = [
  # extract, with Yazi's own extractor (7z does the work)
  { run = "ya pub extract --list %s", desc = "Extract here" },
]
play = [
  # media
  { run = "mpv --force-window %s", desc = "mpv", orphan = true, for = "unix" },
  { run = "xdg-open %s1", desc = "Play", orphan = true, for = "linux" },
]

[open]
rules = [
  # rules for open file

  { mime = "text/*", use = ["edit", "reveal"] },
  { mime = "image/*", use = ["open", "reveal"] },
  { mime = "video/*", use = ["play", "reveal"] },
  { mime = "audio/*", use = ["play", "reveal"] },
  { mime = "inode/x-empty", use = ["edit", "reveal"] },

  { mime = "application/json", use = ["edit", "reveal"] },
  { mime = "*/javascript", use = ["edit", "reveal"] },

  { mime = "application/zip", use = ["extract", "reveal"] },
  { mime = "application/gzip", use = ["extract", "reveal"] },
  { mime = "application/x-tar", use = ["extract", "reveal"] },
  { mime = "application/x-bzip", use = ["extract", "reveal"] },
  { mime = "application/x-bzip2", use = ["extract", "reveal"] },
  { mime = "application/x-7z-compressed", use = ["extract", "reveal"] },
  { mime = "application/x-rar", use = ["extract", "reveal"] },
  { mime = "application/xz", use = ["extract", "reveal"] },

  { url = "*", use = ["open", "reveal"] },
]

[tasks]
micro_workers = 5
macro_workers = 10
bizarre_retry = 5
image_alloc = 536870912
image_bound = [0, 0]
suppress_preload = false

[plugin]

preloaders = [
]
