[config]

# Fixed hues for terminal colours, shifted toward the wallpaper colour
[config.custom_colors]
red     = { color = "#e67e80", blend = true }
green   = { color = "#a7c080", blend = true }
yellow  = { color = "#dbbc7f", blend = true }
blue    = { color = "#7fbbb3", blend = true }
magenta = { color = "#d699b6", blend = true }
cyan    = { color = "#83c092", blend = true }


[templates.eww]
input_path = '~/.config/matugen/templates/eww-colors.scss'
output_path = '~/.config/eww/colors.scss'

#[templates.ags]
#input_path = '~/.config/matugen/templates/ags-colors.scss'
#output_path = '~/ags/colors.scss'

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty-colors.conf'
output_path = '~/.config/kitty/kitty-colors.conf'

[templates.lush]
input_path = '~/.config/matugen/templates/lush-colors.json'
output_path = '~/.config/nvim/colors/lush-colors.json'

[templates.vim]
input_path = '~/.config/matugen/templates/vim-colors.vim'
output_path = '~/.config/nvim/colors/vim-colors.vim'

[templates.rofi]
input_path = '~/.config/matugen/templates/rofi-dark-colors.rasi'
output_path = '~/.config/rofi/rofi-dark-colors.rasi'

[templates.hyprland]
input_path = '~/.config/matugen/templates/hypr-colors.conf'
output_path = '~/.config/hypr/user/colors.conf'

[templates.btop]
input_path = '~/.config/matugen/templates/btop.theme'
output_path = '~/.config/btop/themes/matugen.theme'

[templates.hyprlock]
input_path = '~/.config/matugen/templates/hyprlock-colors.conf'
output_path = '~/.config/hypr/service/hyprlock-colors.conf'

[templates.yazi]
input_path = '~/.config/matugen/templates/yazi-theme.toml'
output_path = '~/.config/yazi/theme.toml'

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-3.0/gtk.css'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-4.0/gtk.css'

[templates.vscode]
input_path = '~/.config/matugen/templates/vscode-colors.json'
output_path = '~/.config/blomst-settings/vscode-colors.json'

[templates.qt6ct]
input_path = '~/.config/matugen/templates/qt6ct-colors.conf'
output_path = '~/.config/qt6ct/colors/matugen.conf'

[templates.sddm]
input_path = '~/.config/matugen/templates/sddm-theme.conf'
output_path = '~/.cache/blomst-sddm/theme.conf.user'

# pywal-style palette, read by the Pywalfox Firefox extension (and anything else that reads pywal colours)
[templates.pywal]
input_path = '~/.config/matugen/templates/pywal-colors.json'
output_path = '~/.cache/wal/colors.json'

# Discord (with Vencord): pick "Blomst" under Settings > Vencord > Themes
[templates.vencord]
input_path = '~/.config/matugen/templates/vencord-theme.css'
output_path = '~/.config/Vencord/themes/blomst.theme.css'
