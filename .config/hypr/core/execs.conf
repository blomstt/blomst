# Auto Start Apps
$serviceDirectory = $HOME/.config/hypr/service

# Themes
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"
exec = gsettings set org.gnome.desktop.interface icon-theme "Papirus-Dark"   # same icons as the launcher and task manager

# Hypr services
exec-once = ~/scripts/wallpaper_daemon.sh   # awww/swww when installed (animated changes), else hyprpaper
exec-once = hypridle

# Widgets
exec-once = eww open-many side-bar notifications

# AirPods battery, noise control and the hi-res mic for the side bar: LibrePods' Rust app built
# from PR #655 (~/Projects/librepods-hires-mic). Its log includes the AirPods' pairing keys, so
# it goes nowhere. The packaged one is `librepods --hide`; only one can run at a time
exec-once = sh -c '~/.local/bin/librepods-hires --start-minimized >/dev/null 2>&1'

# Audio
# exec-once = pipewire & pipewire-pulse & wireplumber

# Remember the size of floating windows per app
exec-once = ~/scripts/float_sizes.py

# Clipboard history for Super + C (when cliphist is installed)
exec-once = sh -c 'command -v cliphist >/dev/null && wl-paste --watch cliphist store'
