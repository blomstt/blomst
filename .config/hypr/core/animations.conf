animations {
    enabled = true

    # Curves
    bezier = emphDecel, 0.05, 0.7, 0.1, 1.0     # fast start, long soft landing (things appearing)
    bezier = emphAccel, 0.3, 0.0, 0.8, 0.15     # slow start, quick exit (things leaving)
    bezier = standard,  0.2, 0.0, 0.0, 1.0      # general movement
    bezier = overshot,  0.05, 0.9, 0.1, 1.06    # slight bounce past the target
    bezier = linear,    0.0, 0.0, 1.0, 1.0

    # Windows
    animation = windowsIn,   1, 5, overshot,  popin 85%
    animation = windowsOut,  1, 3, emphAccel, popin 90%
    animation = windowsMove, 1, 5, standard

    # Layers (eww, rofi, notifications)
    animation = layersIn,      1, 4, emphDecel, popin 92%
    animation = layersOut,     1, 3, emphAccel, popin 95%
    animation = fadeLayersIn,  1, 3, emphDecel
    animation = fadeLayersOut, 1, 2, emphAccel

    # Fades
    animation = fadeIn,     1, 4, emphDecel
    animation = fadeOut,    1, 3, emphAccel
    animation = fadeSwitch, 1, 4, standard
    animation = fadeShadow, 1, 4, standard
    animation = fadeDim,    1, 4, standard

    # Border
    animation = border,      1, 6, standard
    animation = borderangle, 1, 60, linear, loop

    # Workspaces
    animation = workspaces,       1, 5, emphDecel, slidefadevert 20%
    animation = specialWorkspace, 1, 4, emphDecel, slidefadevert 15%
}
